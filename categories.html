<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Categories & Charts — PhonkCharts</title>
<meta name="description" content="Browse phonk, drift, sigma, luxury and more categories, or view the Top 10/25/50/100 trending charts." />
<link rel="canonical" href="https://kon41.github.io/phonkcharts/categories.html" />
<meta name="theme-color" content="#0a0a0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand"><div class="brand__mark">PC</div><div class="brand__name">PHONK<span>CHARTS</span></div></div>
    <ul class="nav-list">
      <li><a class="nav-link" data-nav="home" href="index.html"><span class="material-symbols-outlined">home</span>Home</a></li>
      <li><a class="nav-link" data-nav="search" href="search.html"><span class="material-symbols-outlined">search</span>Search</a></li>
      <li><a class="nav-link active" data-nav="categories" href="categories.html"><span class="material-symbols-outlined">grid_view</span>Categories</a></li>
      <li><a class="nav-link" data-nav="favorites" href="favorites.html"><span class="material-symbols-outlined">favorite</span>Favorites</a></li>
    </ul>
    <div class="sidebar-foot">PhonkCharts · updated daily<br />Data refreshes every 24h</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="topbar__title">Categories & Charts</span>
      <a href="search.html" class="icon-btn" aria-label="Search"><span class="material-symbols-outlined">search</span></a>
    </header>

    <section class="section" style="padding-top:20px;">
      <div class="section__head"><h2 class="section__title">Browse by Category</h2></div>
      <div class="chip-row" id="category-chips"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title" id="chart-heading">Chart</h2>
        <div class="tab-group" id="chart-tabs" role="tablist" aria-label="Chart size">
          <button data-size="10" role="tab" aria-selected="false">Top 10</button>
          <button class="active" data-size="25" role="tab" aria-selected="true">Top 25</button>
          <button data-size="50" role="tab" aria-selected="false">Top 50</button>
          <button data-size="100" role="tab" aria-selected="false">Top 100</button>
        </div>
      </div>

      <div class="toolbar">
        <label for="sort-select" class="visually-hidden">Sort by</label>
        <select id="sort-select" class="select">
          <option value="rank">Sort: Trending Rank</option>
          <option value="popularity">Sort: Popularity</option>
          <option value="newest">Sort: Newest</option>
        </select>
        <button class="chip" id="clear-category" style="display:none;">✕ Clear category filter</button>
      </div>

      <div id="chart-list"></div>
    </section>
  </main>
</div>

<nav class="bottom-nav" aria-label="Mobile navigation">
  <a data-nav="home" href="index.html"><span class="material-symbols-outlined">home</span>Home</a>
  <a data-nav="search" href="search.html"><span class="material-symbols-outlined">search</span>Search</a>
  <a data-nav="categories" href="categories.html" class="active"><span class="material-symbols-outlined">grid_view</span>Categories</a>
  <a data-nav="favorites" href="favorites.html"><span class="material-symbols-outlined">favorite</span>Favorites</a>
</nav>

<script type="module" src="categories.js"></script>
</body>
</html>
